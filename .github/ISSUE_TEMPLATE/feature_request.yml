name: Feature request
description: Something kube-crisp cannot do yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >-
        The projection you want to write, or the thing you want it to do. What
        the feature is for is usually more useful than what it should be called.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >-
        Including "nothing, this is a blocker". A workaround that is merely
        awkward is a different request from one that has none.

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: If you have a shape in mind, the YAML you would want to write.
      render: yaml
