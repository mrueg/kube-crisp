name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Only the release job needs to create the GitHub release.
      contents: write
      # ko pushes the container image to GHCR.
      packages: write
      # Keyless signing exchanges this token with Sigstore for a short-lived
      # certificate, which is what removes the need for a stored private key.
      id-token: write
      # Build provenance for the release artifacts.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      # ko authenticates to GHCR through the Docker config, so log in first.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser shells out to both of these; neither is on the runner.
      #
      # The cosign version is pinned rather than left at the installer default.
      # cosign v3 removed sign-blob's --output-signature and
      # --output-certificate in favour of a single --bundle, so the flags in
      # .goreleaser.yaml are only correct for a known version. Bump this and
      # those args together.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Pinned rather than left at whatever the runner image ships, the same
      # reason cosign is pinned above: the chart this publishes is an artifact
      # people install, so the tool that builds it is not a moving part.
      #
      # The publish step below reads the digest out of `helm push`'s output, so
      # this pin and that parse are one decision -- check the parse against the
      # version before bumping it, the way the cosign flags are checked against
      # cosign's.
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance answers a different question from the cosign signature.
      # The signature says "this release was produced by this workflow"; the
      # attestation records how — which commit, which workflow run, which
      # inputs — and `gh attestation verify` checks it without a key:
      #
      #   gh attestation verify kube-crisp_linux_amd64.tar.gz \
      #     --repo mrueg/kube-crisp
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      # The chart is the only supported way in that otherwise needs a git
      # checkout, so it is published as an OCI artifact where the image already
      # goes:
      #
      #   helm install kube-crisp oci://ghcr.io/mrueg/charts/kube-crisp
      #
      # Version and appVersion are stamped from the tag rather than read from
      # Chart.yaml -- the same reason the binary takes its version from
      # -ldflags. appVersion is the image tag a default install deploys, so
      # stamping it is what makes a published chart that disagrees with its own
      # release impossible rather than merely unlikely.
      #
      # ghcr links the package to this repository through
      # org.opencontainers.image.source, which helm derives from the chart's
      # sources field; the image gets the same annotation from a ko label.
      - name: Publish the Helm chart
        env:
          # Through the environment, so no workflow expression is expanded
          # inside the shell.
          REF_NAME: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"

          printf '%s' "$REGISTRY_PASSWORD" |
            helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin

          helm package charts/kube-crisp \
            --version "$version" --app-version "$version" --destination chart-dist

          # helm prints "Digest: sha256:..." on stdout; signing the digest
          # rather than the tag is what makes the signature name one artifact.
          digest="$(helm push "chart-dist/kube-crisp-${version}.tgz" oci://ghcr.io/mrueg/charts \
            | awk '/^Digest:/ { print $2 }')"
          test -n "$digest"

          cosign sign --yes "ghcr.io/mrueg/charts/kube-crisp@${digest}"
