apiVersion: v2
name: kube-crisp
description: Serve any SQL database as Kubernetes custom resources
type: application

# The chart tracks the application: there is one thing to release, and a second
# number to reason about would only be a second thing to get wrong. Both numbers
# are the released version, so `helm install` with no values deploys the image
# of the same name -- which is what left this at 0.1.0 while 0.2.0 was the
# release, and every default install a version behind.
version: 0.2.0
appVersion: "0.2.0"

kubeVersion: ">=1.29.0-0"
home: https://github.com/mrueg/kube-crisp
sources:
  - https://github.com/mrueg/kube-crisp
keywords:
  - sql
  - postgresql
  - mysql
  - sqlite
  - aggregated-apiserver
  - custom-resources
maintainers:
  - name: mrueg
    url: https://github.com/mrueg
annotations:
  artifacthub.io/license: Apache-2.0
