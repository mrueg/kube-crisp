{{- if .Values.podDisruptionBudget.enabled }}
# An aggregated API server is a single point of failure for every group it
# serves: while no replica is reachable, requests for those groups fail rather
# than merely being slow. Without this, draining a node — or two in sequence,
# faster than a Pod reschedules — can take every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kube-crisp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-crisp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kube-crisp.selectorLabels" . | nindent 6 }}
{{- end }}
