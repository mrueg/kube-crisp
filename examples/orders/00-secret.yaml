# The DSN never appears in the CustomResourceProjection itself.
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
  namespace: kube-crisp
  labels:
    # Without this the server refuses to use the Secret: a projection author
    # chooses the SQL, so the credential's owner chooses whether it may be used.
    crisp.kubecrisp.io/allow-projection: "true"
type: Opaque
stringData:
  dsn: postgres://crisp:changeme@postgres.databases.svc:5432/store?sslmode=require
