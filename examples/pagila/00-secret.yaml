# The connection string for the Pagila database.
#
# The label is not decoration: kube-crisp refuses to read a Secret that does not
# carry it. A projection's author chooses the SQL, so the credential's owner
# chooses whether it may be used at all.
apiVersion: v1
kind: Secret
metadata:
  name: pagila-db
  namespace: kube-crisp
  labels:
    crisp.kubecrisp.io/allow-projection: "true"
type: Opaque
stringData:
  # sslmode is spelled out. Left unset it means "prefer", which tries TLS and
  # then continues without it if the server declines — a connection string that
  # says nothing is not one that gets encryption.
  dsn: postgres://crisp:crisp@postgres.kube-crisp.svc:5432/pagila?sslmode=disable
