# Extra permissions for --enable-admission.
#
# Running the admission chain means watching the objects that describe it:
# webhook configurations, admission policies, and namespaces. These are
# configuration rather than data, but they are cluster-wide reads, so they are
# kept separate from the base RBAC and applied only when admission is enabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-crisp:admission
rules:
  # The webhook plugins resolve which webhooks apply to a projected write, and
  # the policy plugins the policies. Every plugin the server runs by default is
  # listed: a policy plugin refuses every write until its watch has synced, and
  # a watch the cluster forbids never does. The chart's rbac.yaml carries the
  # same rule by hand.
  #
  # A cluster older than 1.36 has no v1 MutatingAdmissionPolicy, and one
  # older than 1.30 no v1 ValidatingAdmissionPolicy; either is a watch that
  # never syncs, so run the server with --disable-admission-plugins naming
  # the plugin there, e.g. --disable-admission-plugins=MutatingAdmissionPolicy.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - mutatingadmissionpolicies
      - mutatingadmissionpolicybindings
    verbs: ["get", "list", "watch"]
  # NamespaceLifecycle rejects writes into namespaces that do not exist or are
  # terminating, which is what stops a projection writing rows for a tenant the
  # cluster does not have.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-crisp:admission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-crisp:admission
subjects:
  - kind: ServiceAccount
    name: kube-crisp-apiserver
    namespace: kube-crisp
