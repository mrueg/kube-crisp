# RBAC for --enable-projection-webhook.
#
# The webhook checks a CustomResourceProjection against its database before the
# cluster accepts it, so SQL the database cannot run is refused at kubectl apply
# rather than reported afterwards in the projection's status.
#
# Two roles. The first is the server's: it registers the
# ValidatingWebhookConfiguration itself because a webhook has no
# insecureSkipTLSVerify — the configuration has to carry a CA bundle that
# verifies this server's certificate, and with the self-signed certificate
# generated by default nobody knows what that is until the server has started.
# Drop --manage-projection-webhook and write the configuration by hand if you
# would rather this server had no such permission.
#
# The second is the caller's. The webhook prepares the statements in a request
# against the database behind the Secret it names, so it answers only a caller
# that is somebody: the kube-apiserver, authenticated as whatever identity the
# cluster's AdmissionConfiguration kubeconfig gives it for this webhook, and
# allowed by this role to reach the path and to write projections. Bind it to
# that identity — the binding is not here because the identity is yours to
# choose; docs/operating.md walks through a ServiceAccount token. A
# kube-apiserver given no credentials for this webhook is refused, and with a
# failure policy of Ignore then skips the check: kube_crisp_admission_reviews_total
# with result="refused" is what that looks like.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-crisp:projection-webhook
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-crisp:projection-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-crisp:projection-webhook
subjects:
  - kind: ServiceAccount
    name: kube-crisp-apiserver
    namespace: kube-crisp
---
# What the kube-apiserver's identity for this webhook needs. The path rule is
# for the server's generic authorization filter, which every path goes through;
# the resource rule is the webhook's own question — may this caller do to
# customresourceprojections what the review says is being done.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-crisp:projection-webhook-caller
rules:
  - nonResourceURLs: ["/admission/customresourceprojections"]
    verbs: ["post"]
  - apiGroups: ["crisp.kubecrisp.io"]
    resources: ["customresourceprojections"]
    verbs: ["create", "update"]
