# The native comparison: an ordinary CRD served by kube-apiserver from etcd,
# holding objects of the same shape as the projected ones.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: benchorders.bench.example.com
spec:
  group: bench.example.com
  scope: Namespaced
  names:
    kind: BenchOrder
    listKind: BenchOrderList
    plural: benchorders
    singular: benchorder
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                customer: {type: string}
                totalCents: {type: integer, format: int64}
            status:
              type: object
              properties:
                phase: {type: string}
